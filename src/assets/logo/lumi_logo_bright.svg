<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo Lumi com brilho suave</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Marca com uma lua crescente em gradiente violeta mais claro, leve brilho ao redor, três pequenos pontos de luz, e o wordmark "Lumi" com a tagline "organize. respire. recomece."</desc>
<defs>
<linearGradient id="moonGradB" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#a894fa"/>
<stop offset="100%" stop-color="#6a5bd4"/>
</linearGradient>
<mask id="moonMaskB">
<rect x="0" y="0" width="680" height="220" fill="black"/>
<circle cx="120" cy="110" r="66" fill="white"/>
<circle cx="150" cy="88" r="54" fill="black"/>
</mask>
<filter id="glowB" x="-60%" y="-60%" width="220%" height="220%">
<feGaussianBlur stdDeviation="10" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>
<circle cx="120" cy="110" r="66" fill="#8b7cf6" opacity="0.35" filter="url(#glowB)" style="fill:rgb(139, 124, 246);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<circle cx="120" cy="110" r="66" fill="url(#moonGradB)" mask="url(#moonMaskB)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<circle cx="196" cy="60" r="5" fill="#c9bffb" style="fill:rgb(201, 191, 251);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<circle cx="212" cy="95" r="3" fill="#a894fa" style="fill:rgb(168, 148, 250);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<circle cx="182" cy="150" r="3.5" fill="#c9bffb" style="fill:rgb(201, 191, 251);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="238" y="128" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="500" fill="#f2f0fa" style="fill:rgb(242, 240, 250);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:58px;font-weight:500;text-anchor:start;dominant-baseline:auto">Lumi</text>
<text x="240" y="158" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#a89cc9" style="fill:rgb(168, 156, 201);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial, Helvetica, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">organize. respire. recomece.</text>
